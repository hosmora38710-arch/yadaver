name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build with Buildozer
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up cache for Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ runner.os }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK using official Buildozer Docker image
        run: |
          docker run --rm \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --volume "$PWD":/home/user/hostcwd \
            --workdir /home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yadavar-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
