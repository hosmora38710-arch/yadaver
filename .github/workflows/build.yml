name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
            
      - name: Install Python packages (fixed version conflict)
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.37
          # نصب نسخه‌های سازگار برای جلوگیری از تداخل sh
          pip install buildozer==1.4.0
          pip install "python-for-android<2025"
          
      - name: Initialize buildozer and build APK
        run: |
          # ایجاد فایل buildozer.spec اگر وجود ندارد
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # ساخت APK
          yes | buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadaver-APK
          path: bin/*.apk
